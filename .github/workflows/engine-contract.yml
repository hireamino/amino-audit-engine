name: Engine contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gitleaks over full history (checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SKILLS_DIR: ${{ github.workspace }}/.cache/amino-skills
      BASELINE_DIR: ${{ github.workspace }}/.cache/amino-audit-action
      ENGINE: ${{ github.workspace }}/src/engine.mjs
      BASELINE_ENGINE: ${{ github.workspace }}/.cache/amino-audit-action/src/engine.mjs
      PUBLIC_LICENSE: ${{ github.workspace }}/.cache/amino-audit-action/LICENSE
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      - name: Fetch exact reviewed-answer contract
        run: scripts/fetch-pinned-skills.sh "$SKILLS_DIR"
      - name: Fetch immutable extraction baseline
        run: scripts/fetch-source-baseline.sh "$BASELINE_DIR"
      - name: G1 — prove source and artifact provenance
        run: node test/provenance.mjs
      - name: G2 — run the unchanged corpus for both surfaces
        run: |
          SURFACE=web node "$SKILLS_DIR/conformance/run.mjs"
          SURFACE=action node "$SKILLS_DIR/conformance/run.mjs"
      - name: G3 — deny network and freeze the clock on both contract surfaces
        run: |
          SURFACE=web RUNNER="$SKILLS_DIR/conformance/run.mjs" EXPECT_FETCH_CALLS=0 node test/network-observe.mjs
          SURFACE=action RUNNER="$SKILLS_DIR/conformance/run.mjs" EXPECT_FETCH_CALLS=0 node test/network-observe.mjs
      - name: G3 positive control — prove the network detector sees a compatibility regression
        run: node test/network-observe-canary.mjs
      - name: G4 — prove all mutation canaries for both surfaces
        run: |
          SURFACE=web node "$SKILLS_DIR/conformance/canary.mjs"
          SURFACE=action node "$SKILLS_DIR/conformance/canary.mjs"
      - name: G5 and G7 — prove output and compatibility equivalence
        run: node test/equivalence.mjs
      - name: G9 and G10 — prove production adapters and the compatibility trap
        run: node test/default-adapters.mjs
      - name: B1 — prove the per-request adapter regression detector
        run: node test/cache-lifetime-canary.mjs
      - name: B2 — prove each valid-but-wrong observation state goes red
        run: node test/observation-canary.mjs
      - name: B3 — prove default-adapter edge mutations go red on named rows
        run: node test/default-adapter-observation-canary.mjs
      - name: N2 — prove the expiry boundary canary
        run: node test/boundary-canary.mjs
      - name: G6 — prove the findings inventory
        run: |
          PARITY_PY="$SKILLS_DIR/amino-deliverability-audit/skills/amino-deliverability-audit/scripts/audit.py" \
            PARITY_JS="$ENGINE" node "$SKILLS_DIR/web-parity/inventory.mjs"
      - name: G8 — prove the SSRF order and ambient-I/O boundary
        run: |
          node test/ssrf.mjs
          node test/purity.mjs
